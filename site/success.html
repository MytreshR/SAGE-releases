<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your SAGE key</title>
    <!-- Nothing here should ever be indexed: the URL carries a session id. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235B4BE8'/%3E%3Cg fill='white'%3E%3Crect x='4.2' y='8.4' width='2.1' height='7.2' rx='1.05'/%3E%3Crect x='7.6' y='5.8' width='2.1' height='12.5' rx='1.05'/%3E%3Crect x='11' y='3.4' width='2.1' height='17.3' rx='1.05'/%3E%3Crect x='14.4' y='5.8' width='2.1' height='12.5' rx='1.05'/%3E%3Crect x='17.8' y='8.4' width='2.1' height='7.2' rx='1.05'/%3E%3C/g%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #07070c;
        --panel: #10101a;
        --line: rgba(255, 255, 255, 0.1);
        --text: #f2f2f5;
        --dim: #9a9aa5;
        --indigo: #7c6cff;
        --good: #4ade80;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        line-height: 1.55;
      }
      .card {
        width: 100%;
        max-width: 540px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 2.2rem;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        font-size: 0.82rem;
        color: var(--dim);
        margin-bottom: 1.6rem;
      }
      h1 {
        font-size: 1.5rem;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }
      .sub {
        color: var(--dim);
        font-size: 0.92rem;
        margin-bottom: 1.6rem;
      }
      .keybox {
        background: #000;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem 1.1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.7rem;
      }
      code {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 1.05rem;
        letter-spacing: 0.04em;
        word-break: break-all;
      }
      button {
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-radius: 7px;
        padding: 0.45rem 0.8rem;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      ol {
        margin: 1.6rem 0 0 1.1rem;
        color: var(--dim);
        font-size: 0.9rem;
      }
      ol li {
        margin-bottom: 0.45rem;
      }
      ol b {
        color: var(--text);
        font-weight: 600;
      }
      .note {
        margin-top: 1.6rem;
        padding-top: 1.3rem;
        border-top: 1px solid var(--line);
        font-size: 0.82rem;
        color: var(--dim);
      }
      a {
        color: var(--indigo);
      }
      .muted {
        color: var(--dim);
        font-size: 0.9rem;
      }
      .bad {
        color: #fca5a5;
      }
      .copied {
        color: var(--good);
        border-color: rgba(74, 222, 128, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="#5B4BE8" />
          <g fill="#fff">
            <rect x="4.2" y="8.4" width="2.1" height="7.2" rx="1.05" />
            <rect x="7.6" y="5.8" width="2.1" height="12.5" rx="1.05" />
            <rect x="11" y="3.4" width="2.1" height="17.3" rx="1.05" />
            <rect x="14.4" y="5.8" width="2.1" height="12.5" rx="1.05" />
            <rect x="17.8" y="8.4" width="2.1" height="7.2" rx="1.05" />
          </g>
        </svg>
        SAGE
      </div>
      <div id="body"><p class="muted">Confirming your payment…</p></div>
    </div>

    <script type="module">
      const body = document.getElementById('body')
      const sessionId = new URLSearchParams(location.search).get('session_id')

      const escape = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        )

      function showPlaceholder({ key, hours }) {
        // A test purchase. Showing a row of Xs with a Copy button beside it
        // would look exactly like a real key that had failed to render, so it
        // says what happened instead.
        body.innerHTML = `
          <h1>Test purchase completed</h1>
          <p class="sub">Payment went through in Stripe's sandbox. No money moved, and
          no real key was issued.</p>
          <div class="keybox">
            <code style="opacity:.55">${escape(key)}</code>
          </div>
          <ol>
            <li>Checkout, the webhook and the ${hours}-hour tier all worked.</li>
            <li>Real keys are minted once the deployment is on a live Stripe key.</li>
          </ol>
          <p class="note">
            Seeing this on the live site by mistake? That means the deployment is
            still using test Stripe keys —
            <a href="mailto:mytresh1984@outlook.com?subject=SAGE%20-%20test%20mode%20on%20live%20site">tell us</a>
            and we will sort it out.
          </p>`
      }

      function showKey({ key, hours, email }) {
        body.innerHTML = `
          <h1>Thank you — here is your key</h1>
          <p class="sub">${hours} hours of listening time${
            email ? `, receipt sent to ${escape(email)}` : ''
          }.</p>
          <div class="keybox">
            <code id="key">${escape(key)}</code>
            <button id="copy">Copy</button>
          </div>
          <ol>
            <li>Open SAGE and go to <b>Settings → App → Activation</b>.</li>
            <li>Paste the key and press <b>Activate</b>.</li>
            <li>Your ${hours} hours are added to that computer straight away.</li>
          </ol>
          <p class="note">
            Keep this key. It activates one computer, and hours stack if you buy
            another. Time is only counted while SAGE is listening.
            <br /><br />
            Lost it, or something went wrong?
            <a href="mailto:mytresh1984@outlook.com?subject=SAGE%20key%20-%20${encodeURIComponent(
              sessionId || ''
            )}">Email us</a> and quote this page's address.
          </p>`

        document.getElementById('copy').addEventListener('click', async (e) => {
          try {
            await navigator.clipboard.writeText(key)
            e.target.textContent = 'Copied'
            e.target.classList.add('copied')
          } catch {
            // Clipboard is blocked in some browsers without a user gesture
            // chain. Selecting it is the honest fallback - the key is on
            // screen either way.
            const range = document.createRange()
            range.selectNodeContents(document.getElementById('key'))
            const sel = getSelection()
            sel.removeAllRanges()
            sel.addRange(range)
            e.target.textContent = 'Selected — press Ctrl+C'
          }
        })
      }

      function showError(message) {
        body.innerHTML = `
          <h1>We could not show your key</h1>
          <p class="sub bad">${escape(message)}</p>
          <p class="note">
            If you have been charged, the key exists and we can send it to you.
            <a href="mailto:mytresh1984@outlook.com?subject=SAGE%20key%20-%20${encodeURIComponent(
              sessionId || ''
            )}">Email us</a> with this page's address and we will sort it out.
          </p>`
      }

      if (!sessionId) {
        showError('This page needs to be opened from the link Stripe sends you after paying.')
      } else {
        // The webhook usually lands before the browser does, but not always.
        // Polling briefly is kinder than telling someone who has just paid
        // that something went wrong.
        let attempt = 0
        const ask = async () => {
          attempt++
          try {
            const res = await fetch('/api/order', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sessionId })
            })
            if (res.status === 202) {
              if (attempt < 15) return setTimeout(ask, 1000)
              return showError('Your payment went through, but the key is taking longer than usual.')
            }
            const data = await res.json()
            if (!res.ok) {
              return showError(
                res.status === 402
                  ? 'This payment has not completed.'
                  : 'We could not find that order.'
              )
            }
            if (data.placeholder) return showPlaceholder(data)
            showKey(data)
          } catch {
            if (attempt < 5) return setTimeout(ask, 1500)
            showError('Could not reach the server.')
          }
        }
        ask()
      }
    </script>
  </body>
</html>
